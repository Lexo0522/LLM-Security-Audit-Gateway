server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolving the gateway through a variable keeps
  # nginx running across gateway container recreations; a static proxy_pass
  # hostname would abort nginx at startup whenever the gateway is absent.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /admin/v1/ {
    set $gateway_admin http://gateway:8081;
    proxy_pass $gateway_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
