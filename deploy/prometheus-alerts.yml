groups:
  - name: ai-audit-gateway
    rules:
      - alert: AuditGatewayNotReady
        expr: audit_ready == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "AI audit gateway is not ready" }
      - alert: AuditPostgresUnavailable
        expr: audit_dependency_healthy{component="postgres"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Gateway PostgreSQL authority is unavailable" }
      - alert: AuditQueueNearCapacity
        expr: audit_event_queue_pending / audit_event_queue_capacity > 0.8
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Audit persistence queue exceeds 80% capacity" }
      - alert: UpstreamDeletionBacklog
        expr: upstream_deletion_backlog > 0
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Upstream deletion backlog is not empty" }
      - alert: UpstreamDeletionOverdue
        expr: upstream_deletion_oldest_age_seconds > 3600
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "An upstream deletion has been overdue for more than one hour" }
      - alert: UpstreamDeletionMalformed
        expr: upstream_deletion_malformed > 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Deleting upstream rows are missing valid purge timestamps" }
      - alert: UpstreamDeletionFinalizerFailures
        expr: increase(upstream_deletion_finalizer_failures_total[15m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "The upstream deletion finalizer is failing" }
      - alert: UpstreamDeletionFinalizerZeroProgress
        expr: upstream_deletion_finalizer_zero_progress_timestamp > 0 and time() - upstream_deletion_finalizer_zero_progress_timestamp > 900
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Due upstream deletions are making no finalizer progress" }
      - alert: AuditOutboxBacklog
        expr: audit_outbox_pending > 1000
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Kafka audit outbox backlog is growing" }
      - alert: AuditOutboxPoison
        expr: audit_outbox_poison > 0
        for: 15m
        labels: { severity: critical }
        annotations: { summary: "Audit outbox contains poison events that exceed the delivery retry cap" }
      - alert: AuditOutboxStalled
        expr: audit_outbox_oldest_age_seconds > 600
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "The oldest undelivered audit outbox row is over 10 minutes old" }
      - alert: AuditConsumerLag
        expr: audit_kafka_consumer_lag > 1000
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "ClickHouse audit consumer is falling behind the Kafka topic" }
      - alert: AuditDLQTraffic
        expr: increase(audit_clickhouse_consumer_dlq_total{result="success"}[15m]) > 0
        labels: { severity: warning }
        annotations: { summary: "Invalid audit events reached the dead-letter queue" }
      - alert: AuditKafkaPublishErrors
        expr: increase(audit_kafka_events_total{result="error"}[5m]) > 10
        labels: { severity: warning }
        annotations: { summary: "Kafka audit delivery is failing repeatedly" }
      - alert: AuditClickHouseInsertErrors
        expr: increase(audit_clickhouse_consumer_inserts_total{result="error"}[5m]) > 0
        labels: { severity: critical }
        annotations: { summary: "ClickHouse audit inserts are failing" }
      - alert: AuditAuditorCircuitOpened
        expr: increase(audit_auditor_circuit_open_total[15m]) > 0
        labels: { severity: warning }
        annotations: { summary: "The model auditor circuit breaker opened" }
      - alert: AuditRedisLocalFallback
        expr: audit_redis_limiter_degraded == 1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Gateway is using local Redis rate-limit fallback" }
      - alert: AuditAuditorUnavailable
        expr: audit_dependency_healthy{component="auditor"} == 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Configured model auditor is unavailable" }
