services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_LISTEN_ADDR: ":8080"
      NEWAPI_BASE_URL: "${NEWAPI_BASE_URL:-http://newapi:3000}"
      NEWAPI_API_KEY: "${NEWAPI_API_KEY:-}"
      AUDIT_ENABLED: "${AUDIT_ENABLED:-true}"
      SSE_AUDIT_WINDOW_BYTES: "${SSE_AUDIT_WINDOW_BYTES:-16384}"
      SSE_MAX_EVENT_BYTES: "${SSE_MAX_EVENT_BYTES:-262144}"
      POSTGRES_URL: "postgres://audit:${POSTGRES_PASSWORD:-change-me}@postgres:5432/audit_gateway?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_AUDIT_TOPIC: "${KAFKA_AUDIT_TOPIC:-audit.events}"
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:-}"
      GATEWAY_API_KEY_PEPPER: "${GATEWAY_API_KEY_PEPPER:?GATEWAY_API_KEY_PEPPER is required and must be at least 32 bytes}"
    depends_on:
      - newapi
      - postgres
      - redis
      - kafka
    restart: unless-stopped

  newapi:
    image: calciumion/new-api:latest
    expose:
      - "3000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    ports:
      - "${INTEGRATION_REDIS_PORT:-16379}:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audit_gateway
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${INTEGRATION_POSTGRES_PORT:-15432}:5432"
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    expose:
      - "8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${INTEGRATION_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    expose:
      - "9092"
    ports:
      - "${INTEGRATION_KAFKA_PORT:-19092}:9094"
    restart: unless-stopped

volumes:
  postgres-data:
  clickhouse-data:
