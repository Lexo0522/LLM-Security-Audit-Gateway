services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_LISTEN_ADDR: ":8080"
      NEWAPI_BASE_URL: "${NEWAPI_BASE_URL:-http://newapi:3000}"
      NEWAPI_API_KEY: "${NEWAPI_API_KEY:-}"
      AUDIT_ENABLED: "${AUDIT_ENABLED:-true}"
    depends_on:
      - newapi
    restart: unless-stopped

  newapi:
    image: calciumion/new-api:latest
    expose:
      - "3000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audit_gateway
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    expose:
      - "8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    restart: unless-stopped

volumes:
  postgres-data:
  clickhouse-data:
