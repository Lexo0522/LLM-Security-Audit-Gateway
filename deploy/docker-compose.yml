services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      # Compose is a local development stack. Production must seed managed
      # rules and policies before the gateway starts.
      GATEWAY_ENV: "development"
      ALLOW_DEMO_BOOTSTRAP_RULES: "true"
      GATEWAY_LISTEN_ADDR: ":8080"
      NEWAPI_BASE_URL: "${NEWAPI_BASE_URL:-http://newapi:3000}"
      NEWAPI_API_KEY: "${NEWAPI_API_KEY:-}"
      AUDIT_ENABLED: "${AUDIT_ENABLED:-true}"
      SSE_AUDIT_WINDOW_BYTES: "${SSE_AUDIT_WINDOW_BYTES:-16384}"
      SSE_MAX_EVENT_BYTES: "${SSE_MAX_EVENT_BYTES:-262144}"
      POSTGRES_URL: "postgres://audit:${POSTGRES_PASSWORD:-change-me}@postgres:5432/audit_gateway?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_AUDIT_TOPIC: "${KAFKA_AUDIT_TOPIC:-audit.events}"
      CLICKHOUSE_DSN: "http://audit:${CLICKHOUSE_PASSWORD:-change-me}@clickhouse:8123/default"
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:-}"
      GATEWAY_API_KEY_PEPPER: "${GATEWAY_API_KEY_PEPPER:?GATEWAY_API_KEY_PEPPER is required and must be at least 32 bytes}"
    depends_on:
      newapi:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  audit-consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    entrypoint: ["/audit-consumer"]
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_AUDIT_TOPIC: "${KAFKA_AUDIT_TOPIC:-audit.events}"
      KAFKA_AUDIT_DLQ_TOPIC: "${KAFKA_AUDIT_DLQ_TOPIC:-audit.events.dlq}"
      KAFKA_CONSUMER_GROUP: "${KAFKA_CONSUMER_GROUP:-audit-clickhouse-v1}"
      CLICKHOUSE_DSN: "http://audit:${CLICKHOUSE_PASSWORD:-change-me}@clickhouse:8123/default"
      AUDIT_CONSUMER_LISTEN_ADDR: ":9090"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  newapi:
    # Pinned instead of latest so development and production upgrades are a
    # deliberate change; bump the tag after reviewing release notes.
    image: calciumion/new-api:v0.13.2
    expose:
      - "3000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    ports:
      - "${INTEGRATION_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audit_gateway
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${INTEGRATION_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit_gateway"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: audit
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-change-me}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    expose:
      - "8123"
    ports:
      - "${INTEGRATION_CLICKHOUSE_PORT:-18123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${INTEGRATION_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    expose:
      - "9092"
    ports:
      - "${INTEGRATION_KAFKA_PORT:-19092}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  clickhouse-data:
  kafka-data:
