server {
  listen 80;
  server_name _;

  location = /healthz {
    return 200 "ok";
  }

  # Echoes which mock upstream answered and the Authorization header exactly
  # as the gateway sent it, so the smoke test can assert key isolation and
  # that the server-side upstream API key decrypts correctly.
  location /v1/ {
    default_type application/json;
    return 200 '{"upstream":"a","auth":"$http_authorization","path":"$request_uri"}';
  }

  location / {
    default_type application/json;
    return 404 '{"error":"mock upstream only serves /v1/"}';
  }
}
